<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة أثر - تقديم المقترحات</title>
  
  <style>
    /* ==========================================
       التصميم والألوان الخاصة بالمنصة (CSS)
       ========================================== */
    :root {
      --primary-color: #0d6efd;
      --primary-hover: #0b5ed7;
      --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      --card-bg: #ffffff;
      --text-dark: #212529;
      --border-color: #dee2e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .main-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    /* قسم الهيدر والصورة الشخصية */
    .profile-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar-container {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--primary-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      background-color: #e9ecef;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      color: var(--text-dark);
      font-size: 22px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6c757d;
      font-size: 13px;
    }

    /* حقول الإدخال */
    .input-group {
      margin-bottom: 16px;
      text-align: right;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      color: #333;
    }

    .input-group input,
    .input-group select,
    .input-group textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      background-color: #f8f9fa;
      transition: all 0.3s ease;
      outline: none;
    }

    .input-group input:focus,
    .input-group select:focus,
    .input-group textarea:focus {
      border-color: var(--primary-color);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }

    .input-group textarea {
      resize: vertical;
      height: 100px;
    }

    /* زر الإرسال */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: #a5c7fe;
      cursor: not-allowed;
    }

    /* صندوق التنبيهات */
    #status-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      display: none;
    }

    #status-box.success {
      background-color: #d1e7dd;
      color: #0f5132;
    }

    #status-box.error {
      background-color: #f8d7da;
      color: #842029;
    }
  </style>
</head>
<body>

  <div class="main-card">
    
    <!-- قسم الهيدر والصورة -->
    <div class="profile-header">
      <div class="avatar-container">
        <img src="profile.jpg" alt="منصة أثر" class="profile-img">
      </div>
      <h2 class="title">منصة أثر 💡</h2>
      <p class="subtitle">شاركونا أفكاركم ومقترحاتكم لتطوير المبادرة</p>
    </div>

    <!-- النموذج بالطريقة المباشرة -->
    <form id="atharForm" action="https://formspree.io/f/xvkopbwz" method="POST">
      
      <div class="input-group">
        <label for="from_name">اسم الطالب</label>
        <input type="text" id="from_name" name="from_name" required placeholder="أدخل اسمك بالكامل">
      </div>

      <div class="input-group">
        <label for="gender">النوع</label>
        <select id="gender" name="gender" required>
          <option value="" disabled selected>اختر النوع</option>
          <option value="ذكر">ذكر</option>
          <option value="أنثى">أنثى</option>
        </select>
      </div>

      <div class="input-group">
        <label for="district">الإدارة التعليمية</label>
        <input type="text" id="district" name="district" required placeholder="أدخل إدارتك التعليمية">
      </div>

      <div class="input-group">
        <label for="grade">الصف الدراسي</label>
        <input type="text" id="grade" name="grade" required placeholder="مثال: الصف الثاني الثانوي">
      </div>

      <div class="input-group">
        <label for="message">الفكرة / المقترح</label>
        <textarea id="message" name="message" required placeholder="اكتب تفاصيل فكرتك هنا..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">إرسال الفكرة</button>
    </form>

    <!-- صندوق رسالة التأكيد والخطأ -->
    <div id="status-box"></div>

  </div>

  <!-- ==========================================
       برمجة الإرسال (JavaScript)
       ========================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('atharForm');
      const submitBtn = document.getElementById('submitBtn');
      const statusBox = document.getElementById('status-box');

      if (!form) return;

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        // 1. تعطيل الزر أثناء الإرسال
        submitBtn.disabled = true;
        const originalText = submitBtn.innerText;
        submitBtn.innerText = 'جاري الإرسال...';
        if (statusBox) statusBox.style.display = 'none';

        // 2. تجهيز البيانات
        const formData = new FormData(form);

        try {
          // 3. الإرسال عبر Fetch
          const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
              'Accept': 'application/json'
            }
          });

          if (response.ok) {
            if (statusBox) {
              statusBox.className = 'success';
              statusBox.innerText = 'تم إرسال فكرتك بنجاح! شكرًا لمشاركتك. ✨';
              statusBox.style.display = 'block';
            }
            form.reset();
          } else {
            throw new Error('حدث خطأ في الإرسال');
          }
        } catch (error) {
          if (statusBox) {
            statusBox.className = 'error';
            statusBox.innerText = 'تعذر إرسال الرسالة، يرجى المحاولة لاحقاً.';
            statusBox.style.display = 'block';
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = originalText;
        }
      });
    });
  </script>
</body>
</html>
